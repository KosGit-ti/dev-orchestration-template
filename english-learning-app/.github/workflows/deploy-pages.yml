# =============================================================================
# GitHub Pages への配信
# =============================================================================
# main への push で静的エクスポートを作り、Pages へ載せる。
#
# 前提:
#   - リポジトリの Settings > Pages で Source を "GitHub Actions" にしておく。
#   - Private リポジトリの Pages は GitHub Pro 以上が要る。プランが足りない
#     場合はこのワークフローを無効化し、docs/runbook.md の代替配信手順を使う。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 配信は 1 本だけ走らせる。実行中のデプロイは中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # NOTE: BL-002 でハッシュ固定へ揃える。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/configure-pages@v5
        id: pages

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build static export
        working-directory: web
        # プロジェクトサイト（/<repo>/ 配信）に合わせて basePath を渡す。
        # 独自ドメインでルート配信する場合は base_path が空になり、そのまま動く。
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
